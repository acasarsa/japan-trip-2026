<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Phrases — Sample</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0eb;
      color: #1a1a1a;
      padding: 24px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 24px;
    }

    .phrase-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .category {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 12px;
    }

    .japanese {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .romaji {
      font-size: 14px;
      color: #555;
      font-style: italic;
      margin-bottom: 4px;
    }

    .english {
      font-size: 14px;
      color: #333;
      margin-bottom: 20px;
    }

    a.translate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1a1a1a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }

    a.translate-btn:active {
      background: #333;
    }

    .notice {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>Japan Phrases</h1>
  <p class="subtitle">Sample — opens Google Translate to play audio or show to someone</p>

  <div class="phrase-card">
    <div class="category">Ordering at the counter</div>
    <div class="japanese">おすすめは何ですか？</div>
    <div class="romaji">Osusume wa nan desu ka?</div>
    <div class="english">"What do you recommend?"</div>
    <a class="translate-btn" href="https://translate.google.com/?sl=ja&tl=en&text=おすすめは何ですか？&op=translate" target="_blank">
      🔊 Open in Google Translate
    </a>
  </div>

  <p class="notice">Tap the speaker in Google Translate to play,<br>or show the screen to someone to read.</p>

</body>
</html>
